name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://server.terraintool.com/api' }}
          # Served from the root of the custom domain (public/CNAME). Set the repository variable to
          # /<repo-name>/ only if the site is served from https://<owner>.github.io/<repo-name>/ instead.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}

      # GitHub Pages has no SPA rewrites; serving index.html as 404.html lets React Router handle deep links.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
